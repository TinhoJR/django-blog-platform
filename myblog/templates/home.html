{% extends 'base.html' %}
{% load humanize %}
{% load custom_utilsy custom_utils %}




{% block content %}
<section class="hero-section">
   <main>
    <div class="bg-overlay"></div>

     <div>
        <div class="row">
          <div class="col-lg-6 col-md-6 col-12">
            <div class="hero-content">
                <h3>
                   Find <span> hope,faith</span> & anwers through the word 
                </h3>

                <form>
                    <input placeholder="Search for articles..." type="text" id="searchInput">
                    <button type="submit">Search</button>
                    <div class="searchResult"></div>
                </form>

                <div class="callToaction-btn-wrapper">
                    <button class="callToaction-btn">
                       Explore Articles
                    </button>
                     <button class="callToaction-btn">
                       Join Our Community
                    </button>
                </div>
            </div>
          </div>
        </div>
    </div>
   </main>
</section>


<section class="dailyVerse-section">
   <div class="dailyverse-wrapper">
     <div class="row gy-4 gx-0 gx-md-4">
        <div class="col-md-5 col-lg-5 col-12">
            <div class="dailyVerse-intro">
                <h4>
                    Verse of the Day
                </h4>
            </div>
        </div>

        <div class="col-md-7 col-lg-7 col-12">
            <div class="dailyVerse">
                <p>
                    Psalm 24:17
                </p>

                <h5>
                    When the righteous cry for help, the Lord hears and delivers them from 
                    all troubles. 
                </h5>
            </div>
        </div>
     </div>
   </div>
  </section>
{% endblock %}
