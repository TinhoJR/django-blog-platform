<!DOCTYPE html>

<html>

<head>
    <style>
        

        a{
            color: black;
            text-decoration: none;
        }

         table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        tr:hover {
            background: #f9f9f9;
        }

       

    </style>
</head>


{% if marketlists %}



<table>
    <thead>
         <tr>
            <th>ID</th>
            <th>ITEM</th>
            <th>QTY</th>
            <th>PRICE</th>
            <th>TOTAL</th>
            
        </tr>
    </thead>
    
    <tbody>
        {% for list in marketlists %}
        <tr>
            <td>{{list.id}}</td>
            <td><a href="">{{list.item|upper}}</a></td>
            <td>{{list.qty}}</td>
            <td>{{list.price}}</td>
            <td>{{list.total}}</td>
            
        </tr>
        {% endfor %}
    </tbody>
</table>

{% else  %}
<h3>NO LIST ADDED YET</h3>

{% endif  %}


<h4><a href="{% url 'create-list' %}">ADD LIST</a></h4>
<h4><a href="{% url 'create-list' %}">ADD LIST</a></h4>



</html>
